name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Tests temporarily disabled due to vitest/MCP SDK compatibility issue
      # - name: Create test environment file
      #   run: |
      #     echo "LASTFM_API_KEY=test-api-key" > .dev.vars
      #     echo "LASTFM_SHARED_SECRET=test-shared-secret" >> .dev.vars  
      #     echo "JWT_SECRET=test-jwt-secret" >> .dev.vars
      #
      # - name: Run tests
      #   run: npm test

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: dist/
          retention-days: 7

# Note : le déploiement vers Cloudflare est géré par l'intégration Git native de
# Cloudflare Workers (Settings > Build du worker mcp-lastfm), pas par ce workflow.
# L'ancien job "deploy" (wrangler deploy --env production) était cassé et redondant :
# il a été retiré. Ce workflow ne fait plus que lint + build comme garde-fou.
