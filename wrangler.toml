name = "lastfm-mcp"
main = "src/index-oauth.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]

[observability]
enabled = true

# Development environment (default)
[[kv_namespaces]]
binding = "MCP_RL"
id = "b2d300eb168745a1abab5dcc58b19103"

[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "88451f091f5447d4bfdfc18b482c9e00"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "9dd06247c8d44ce8bd707144475ac66a"

# Production environment
[env.production]
name = "lastfm-mcp-prod"

[[env.production.kv_namespaces]]
binding = "MCP_RL"
id = "bfc831cedceb4a08a6d997909c3899ce"

[[env.production.kv_namespaces]]
binding = "MCP_SESSIONS"
id = "e45edcc5347e4b409169c1d0a9b2ed5d"

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "8c3a19a93165452b9ab0215bdb3daa71"

# Secrets (set via wrangler secret put):
# - LASTFM_API_KEY
# - LASTFM_SHARED_SECRET
# - JWT_SECRET 